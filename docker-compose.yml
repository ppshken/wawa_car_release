version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wawa_car_release_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: car_release_db
      MYSQL_USER: wawa_user
      MYSQL_PASSWORD: wawa_password
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./car_release_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wawa_car_release_phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wawa_car_release_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: car_release_db
      JWT_SECRET: wawa_car_release_secret_key_2026_jwt
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wawa_car_release_frontend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db_data:
